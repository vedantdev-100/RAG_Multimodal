name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # Same policy as pyproject.toml — belt and suspenders. If pyproject.toml's
  # exclude-newer/prerelease settings are ever edited, this makes it obvious
  # in the CI diff too rather than only living in one file.
  UV_LOCKED: "1"

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.11.7"          # uv itself is pinned too — see AGENTS.md
          enable-cache: true

      # Docling's dependency chain (opencv, via docling-ibm-models) needs
      # these even for import-only usage like `ruff`/`mypy` collecting the app.
      - name: Install system dependencies for Docling/opencv
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0

      # --locked: fail the build instead of silently re-resolving if
      # pyproject.toml and uv.lock have drifted apart. This is the single
      # most important line in this file — it's what "lock CI to uv.lock"
      # actually means in practice.
      - name: Install dependencies (fail on lock drift)
        run: uv sync --locked --all-groups

      - name: Ruff lint
        run: uv run ruff check .

      - name: mypy
        run: uv run mypy app --ignore-missing-imports

  test:
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    services:
      postgres:
        image: pgvector/pgvector:pg16  # postgres:16 + pgvector extension preinstalled
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_platform_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.11.7"
          enable-cache: true

      - name: Install system dependencies for Docling/opencv
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0

      - name: Install dependencies (fail on lock drift)
        run: uv sync --locked --all-groups

      - name: Generate ephemeral JWT keypair for tests
        run: |
          mkdir -p secrets
          openssl genrsa -out secrets/private_key.pem 2048
          openssl rsa -in secrets/private_key.pem -pubout -out secrets/public_key.pem

      - name: Run migrations
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ai_platform_test
          JWT_PRIVATE_KEY_PATH: secrets/private_key.pem
          JWT_PUBLIC_KEY_PATH: secrets/public_key.pem
        run: uv run alembic upgrade head

      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ai_platform_test
          REDIS_URL: redis://localhost:6379/0
          JWT_PRIVATE_KEY_PATH: secrets/private_key.pem
          JWT_PUBLIC_KEY_PATH: secrets/public_key.pem
        run: uv run pytest -v

  lockfile-check:
    # Standalone guard so a lock/pyproject mismatch is caught with a clear,
    # dedicated failure message, independent of the jobs above.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.11.7"
      - name: Verify uv.lock matches pyproject.toml
        run: uv lock --check
